# ============================================================================
# 图片打标流水线 —— 配置
#
# 这是**唯一**需要手改的文件。
#
# 路径可以是相对的(相对本文件所在目录,也就是项目根),也可以是绝对的
# —— 比如把 library 指到 OneDrive 上的目录。
#
# ⚠ 键名写错会直接报错并列出可用键,不会静默用默认值。这是有意的:
#    阈值一旦写进图片的 XMP 就改不回来了,一个拼错的键名被默认值兜住,
#    等于口径被永久改变而且毫无提示。
# ============================================================================

[paths]
inbox   = "inbox"      # 待处理:往里丢图,或丢一个文件夹当合集
library = "library"    # 已处理:按日归档,是**唯一需要同步到 OneDrive 的东西**
failed  = "failed"     # 处理不了的文件/合集,隔离在这里
local   = "_local"     # 本地状态(数据库/日志/暂存/设备标识)。**绝不要同步**
models  = "models"     # 模型文件

[model]
file = "model.onnx"        # WD14 / WD-v3 模型
tags = "selected_tags.csv"  # 标签表

# ---------------------------------------------------------------------------
# 推理阈值
#
# 这三个值会被写进每张图片的 XMP,所以**改它们会让新旧图片口径不一致**。
# 想放宽标准去看低分 tag,用 `--min-conf` 查询,不要改这里。
# ---------------------------------------------------------------------------
[thresholds]
general   = 0.35   # 普通标签:超过它才算「命中」
character = 0.75   # 角色名:单独一档,因为角色识别本来就该更严
record_floor = 0.15  # 落库下限。低于它的 tag 完全不写库
                     # 调到 0.35 就退回「只存过阈值的」策略 —— 库更小,
                     # 但没进库的 tag 以后无论怎么调阈值都查不回来

[limits]
image_top_n      = 100  # 每张图最多落库多少条 tag(过阈值的永远不会被截掉)
collection_top_n = 50   # 合集频次表最多记多少条
max_coll_depth   = 8    # 子合集嵌套深度上限。每层目录名约 19 字符,
                        # 不设限迟早撞 Windows 的路径长度上限

[xmp]
# XMP 包里的预留空白。别的工具想原地改标签就不用重写整个文件 ——
# 而重写会在 OneDrive 产生冲突副本。去掉能省约 0.37 GB/年(按 1000 张/天)。
padding = 1024

[collections]
# 这些名字几乎必然是随手建的,而且几乎必然会被重复投放。
generic_names = [
    "新建文件夹",
    "new folder",
    "未命名文件夹",
    "untitled folder",
    "无标题文件夹",
]
